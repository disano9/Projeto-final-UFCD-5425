<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Jogador - Dark Team Manager</title>
</head>
<body>

    <h1>Editar Jogador</h1>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <p>{{ mensagem }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ jogador['nome'] }}"
            required
        >

        <br><br>

        <label for="nickname">Nickname:</label>
        <input
            type="text"
            id="nickname"
            name="nickname"
            value="{{ jogador['nickname'] }}"
            required
        >

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ jogador['email'] or '' }}"
        >

        <br><br>

        <label for="telemovel">Telemóvel:</label>
        <input
            type="text"
            id="telemovel"
            name="telemovel"
            value="{{ jogador['telemovel'] or '' }}"
        >

        <br><br>

        <button type="submit">Guardar alterações</button>

    </form>

    <br>

    <a href="{{ url_for('jogador.jogadores') }}">Voltar aos jogadores</a>

</body>
</html>
