
{% extends "base/layout.html" %}

{% block title %}Editar Jogador | Dark Team Manager{% endblock %}

{% block content %}

<div class="page-heading">
    <div>
        <h1>Editar Jogador</h1>
        <p>Atualiza os dados e as informações do jogador.</p>
    </div>
</div>

<div class="content-card">
    <h2>Dados do jogador</h2>

    <form method="POST" class="form-container">

        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ jogador['nome'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="nickname">Nickname</label>
            <input
                type="text"
                id="nickname"
                name="nickname"
                value="{{ jogador['nickname'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ jogador['email'] or '' }}"
            >
        </div>

        <div class="form-group">
            <label for="telemovel">Telemóvel</label>
            <input
                type="text"
                id="telemovel"
                name="telemovel"
                value="{{ jogador['telemovel'] or '' }}"
            >
        </div>

        <button type="submit">Guardar alterações</button>

    </form>

    <a class="player-button"
       href="{{ url_for('jogador.jogadores') }}">
        ← Voltar aos jogadores
    </a>
</div>

{% endblock %}
