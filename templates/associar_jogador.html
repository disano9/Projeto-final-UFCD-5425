<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Associar Jogador - Dark Team Manager</title>
</head>
<body>

    <h1>Associar Jogador a uma Equipa</h1>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <p>{{ mensagem }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Jogador:</label>
        <select name="jogador_id" required>
            <option value="">Selecionar jogador</option>
            {% for jogador in jogadores %}
                <option value="{{ jogador['id'] }}">
                    {{ jogador['nickname'] }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Equipa:</label>
        <select name="equipa_id" required>
            <option value="">Selecionar equipa</option>
            {% for equipa in equipas %}
                <option value="{{ equipa['id'] }}">
                    {{ equipa['nome'] }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Posição:</label>
        <select name="posicao" required>
            <option value="">Selecionar posição</option>
            <option value="Top">Top</option>
            <option value="Jungle">Jungle</option>
            <option value="Mid">Mid</option>
            <option value="ADC">ADC</option>
            <option value="Support">Support</option>
        </select>

        <br><br>

        <label>Data de entrada:</label>
        <input type="date" name="data_entrada" required>

        <br><br>

        <button type="submit">Associar Jogador</button>

    </form>

    <br>

    <a href="{{ url_for('equipa.listar') }}">Voltar às equipas</a>

</body>
</html>
